<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>I want a cat! – Animal shelters near you</title>
    <meta name="description" content="Find animal shelters near you and adopt a cat. Free, open-source and based on OpenStreetMap data." />
    <meta name="theme-color" content="#1976d2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        const t = localStorage.getItem('theme');
        document.documentElement.dataset.theme = t === 'dark' || t === 'light' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch {}
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="site-header">
      <div>
        <h1 class="title"><a href="/">🐾 I want a cat!</a></h1>
        <p class="tagline">Find animal shelters near you</p>
      </div>
      <button id="theme-toggle" class="icon-button" type="button">🌙</button>
    </header>

    <main class="layout">
      <section class="panel controls" aria-label="Find shelters">
        <form id="search-form" class="search" role="search">
          <label class="visually-hidden" for="search-input">City, address or postcode</label>
          <input id="search-input" type="search" name="q" placeholder="City, address or postcode" autocomplete="off" enterkeyhint="search" required />
          <button class="button button-primary" type="submit">Search</button>
        </form>
        <div class="divider"><span>or</span></div>
        <button id="locate-button" class="button button-secondary locate" type="button">📍 Use my location</button>
        <div id="place-results" class="place-results" hidden></div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <div id="map" class="map" role="region" aria-label="Map of animal shelters"></div>

      <section class="panel results" aria-label="Nearby animal shelters">
        <ol id="shelter-list" class="shelter-list"></ol>
        <p id="data-note" class="data-note" hidden></p>
      </section>
    </main>

    <footer class="site-footer">
      <span>Shelter data &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors</span>
      <span>Missing a shelter? <a href="https://www.openstreetmap.org/" target="_blank" rel="noopener noreferrer">Add it to OpenStreetMap</a></span>
      <a href="/gdpr.html">Privacy policy</a>
      <a href="https://github.com/b0t-at/iWantACat-website" target="_blank" rel="noopener noreferrer">Source code</a>
    </footer>
  </body>
</html>
